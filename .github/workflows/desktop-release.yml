name: Cross-platform bridge release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (leave blank to build only)
        required: false
        default: ''
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: redxdex-bridge-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool libgtk-3-0 libnss3 libasound2t64 libsecret-1-0 dbus-x11 libfuse2t64
      - run: npm ci --no-audit --no-fund
      - name: Install pinned server SDK for its offline contract test
        run: npm ci --prefix services/bridge-platform --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Generate branded Windows installer assets
        if: runner.os == 'Windows'
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/generate-installer-theme.py
      - run: npm run check
      - run: npm run prepare:native
      - run: npm run prepare:tunnel
      - name: Windows GUI and native tests
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:REDXDEX_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bridge-gui-data'
          $env:REDXDEX_SMOKE_OUTPUT = Join-Path $pwd 'verification/gui'
          node scripts/gui-smoke-capture.cjs --build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\node_modules\.bin\electron.cmd .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:REDXDEX_SMOKE_OUTPUT
          & .\node_modules\.bin\electron.cmd scripts/desktop-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux GUI and native tests
        timeout-minutes: 5
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export REDXDEX_DATA_DIR="$RUNNER_TEMP/bridge-gui-data"
          export REDXDEX_SMOKE_OUTPUT="$PWD/verification/gui"
          xvfb-run -a --server-args='-screen 0 1280x800x24' dbus-run-session -- node_modules/.bin/electron . --no-sandbox
          unset REDXDEX_SMOKE_OUTPUT
          xvfb-run -a --server-args='-screen 0 1280x800x24' dbus-run-session -- node_modules/.bin/electron scripts/desktop-smoke.cjs --no-sandbox
      - name: Windows Red-XAI signed-out GUI and MCP smoke
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:REDXDEX_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bridge-locked-data'
          $env:REDXDEX_AUTH_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 'bridge-auth-smoke'
          & .\node_modules\.bin\electron.cmd .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Get-Content (Join-Path $env:REDXDEX_AUTH_SMOKE_OUTPUT 'result.json') -Raw | ConvertFrom-Json
          if (-not ($r.gatewayLocked -and $r.accountLocked -and $r.privilegedIPCRejected -and $r.quickButton -and $r.manualForm)) { exit 1 }
          Remove-Item Env:REDXDEX_AUTH_SMOKE_OUTPUT
          Remove-Item Env:REDXDEX_DATA_DIR
      - name: Linux Red-XAI signed-out GUI and MCP smoke
        timeout-minutes: 5
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export REDXDEX_DATA_DIR="$RUNNER_TEMP/bridge-locked-data"
          export REDXDEX_AUTH_SMOKE_OUTPUT="$RUNNER_TEMP/bridge-auth-smoke"
          xvfb-run -a --server-args='-screen 0 1280x800x24' dbus-run-session -- node_modules/.bin/electron . --no-sandbox
          node -e 'const r=require(process.env.REDXDEX_AUTH_SMOKE_OUTPUT+"/result.json");if(!r.gatewayLocked||!r.accountLocked||!r.privilegedIPCRejected||!r.quickButton||!r.manualForm)process.exit(1);'
          unset REDXDEX_DATA_DIR REDXDEX_AUTH_SMOKE_OUTPUT
      - name: Windows sign-in button interaction regression
        if: runner.os == 'Windows'
        run: .\node_modules\.bin\electron.cmd scripts/login-interaction-smoke.cjs
      - name: Linux sign-in button interaction regression
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' dbus-run-session -- node_modules/.bin/electron scripts/login-interaction-smoke.cjs --no-sandbox
      - name: Windows platform pages regression
        if: runner.os == 'Windows'
        run: .\node_modules\.bin\electron.cmd scripts/platform-ui-smoke.cjs
      - name: Verify direct CLI download from the published public release
        if: runner.os == 'Windows'
        run: node scripts/cli-download-live-smoke.cjs
      - name: Linux platform pages regression
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args='-screen 0 1440x1000x24' dbus-run-session -- node_modules/.bin/electron scripts/platform-ui-smoke.cjs --no-sandbox
      - name: Build Windows installer
        id: windows-package
        if: runner.os == 'Windows'
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Verify packaged Windows sign-in interactions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BRIDGE_TEST_ASAR = Join-Path $pwd 'dist/win-unpacked/resources/app.asar'
          & .\node_modules\.bin\electron.cmd scripts/login-interaction-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:BRIDGE_TEST_ASAR
      - name: Verify packaged Linux sign-in interactions
        if: runner.os == 'Linux'
        env:
          BRIDGE_TEST_ASAR: ${{ github.workspace }}/dist/linux-unpacked/resources/app.asar
        run: xvfb-run -a --server-args='-screen 0 1280x800x24' dbus-run-session -- node_modules/.bin/electron scripts/login-interaction-smoke.cjs --no-sandbox
      - name: Install Windows release silently and verify installed login and native helper
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/installer-silent-smoke.ps1
      - name: Capture Windows installer theme and compare it with native progress
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows-package.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/installer-theme-smoke.ps1
      - name: Hash release artifacts
        run: node scripts/check-artifacts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS-*
            verification/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.tag != '') || startsWith(github.ref, 'refs/tags/v')
    needs: [build, mac-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Red-XAI Quick Login supports Bridge before publishing
        run: node scripts/check-production-auth.cjs
      - name: Require verified production account and billing integration
        run: node scripts/check-platform-readiness.cjs
      - name: Select the newest verified artifact IDs from this run and commit
        id: release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/release-artifacts.json"
          node scripts/select-release-artifacts.cjs "$RUNNER_TEMP/release-artifacts.json"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.release-artifacts.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: artifacts
      - name: Publish verified Windows and Linux installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then echo "Release tag does not match package version" >&2; exit 1; fi
          test -f "RELEASE-${RELEASE_TAG#v}.md"
          if ! gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "RedXDexAiBridge ${RELEASE_TAG#v} — Windows/Linux" --notes-file "RELEASE-${RELEASE_TAG#v}.md" --target "$GITHUB_SHA"
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(find artifacts -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find artifacts -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find artifacts -type f -name '*.deb' | wc -l)" -ge 1
          find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name 'latest*.yml' -o -name '*.blockmap' -o -name 'SHA256SUMS-*' \) -print0 | while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets --jq '{draft: .isDraft, prerelease: .isPrerelease, assets: (.assets | length)}'
  mac-smoke:
    name: macOS one-click setup and native helper checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install pinned server SDK for its offline contract test
        run: npm ci --prefix services/bridge-platform --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Compile macOS native input helper
        run: npm run prepare:native
      - name: Verify compiled helper exists
        run: test -x build/redxdex-control
      - name: macOS window-hidden background process smoke
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          export REDXDEX_DATA_DIR="$RUNNER_TEMP/bridge-mac-background-data"
          export REDXDEX_SMOKE_OUTPUT="$RUNNER_TEMP/bridge-mac-background-smoke"
          ./node_modules/.bin/electron . > "$RUNNER_TEMP/bridge-mac-background.log" 2>&1 || { cat "$RUNNER_TEMP/bridge-mac-background.log"; exit 1; }
          node -e 'const fs=require("fs"),p=process.env.REDXDEX_SMOKE_OUTPUT+"/result.json",r=JSON.parse(fs.readFileSync(p,"utf8"));if(!r.backgroundWhileHidden||r.crawlerTools!==5||r.rendererErrors?.length)process.exit(1);console.log("macOS background smoke passed",r.navigation.length,"pages");'


      - name: macOS sign-in button interaction regression
        run: ./node_modules/.bin/electron scripts/login-interaction-smoke.cjs
      - name: macOS platform pages regression
        run: ./node_modules/.bin/electron scripts/platform-ui-smoke.cjs
      - name: macOS Red-XAI signed-out GUI and MCP smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          unset REDXDEX_SMOKE_OUTPUT
          export REDXDEX_DATA_DIR="$RUNNER_TEMP/bridge-auth-data"
          export REDXDEX_AUTH_SMOKE_OUTPUT="$RUNNER_TEMP/bridge-auth-smoke"
          ./node_modules/.bin/electron . > "$RUNNER_TEMP/bridge-auth-smoke.log" 2>&1 || { cat "$RUNNER_TEMP/bridge-auth-smoke.log"; exit 1; }
          node -e 'const r=require(process.env.REDXDEX_AUTH_SMOKE_OUTPUT+"/result.json");if(!r.gatewayLocked||!r.accountLocked||!r.privilegedIPCRejected||!r.quickButton||!r.manualForm)process.exit(1);'
      - name: Upload macOS smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-mac-smoke-diagnostics
          path: |
            ${{ runner.temp }}/bridge-mac-background.log
            ${{ runner.temp }}/bridge-mac-background-smoke/result.json
            ${{ runner.temp }}/bridge-mac-background-smoke/*.png
            ${{ runner.temp }}/bridge-auth-smoke.log
            ${{ runner.temp }}/bridge-auth-smoke/result.json
            ${{ runner.temp }}/bridge-auth-smoke/*.png
            verification/platform-ui/result.json
            verification/platform-ui/*.png
          if-no-files-found: warn
          retention-days: 14
